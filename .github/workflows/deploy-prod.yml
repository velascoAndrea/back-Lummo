name: Deploy Prod

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    name: Backend → Lambda (prod)
    runs-on: ubuntu-latest
    environment: production   # requires manual approval in GitHub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build Lambda package
        run: |
          mkdir -p package
          pip install -r requirements.txt -t package/ \
            --platform manylinux2014_x86_64 \
            --implementation cp \
            --python-version 3.11 \
            --only-binary=:all: \
            --upgrade --quiet
          cp -r app/ package/app/
          cd package && zip -r ../lambda.zip . -x "*.pyc" -x "*/__pycache__/*" && cd ..

      - name: Upload package to S3
        run: |
          aws s3 cp lambda.zip s3://${{ secrets.DEPLOYMENTS_S3_BUCKET }}/prod/lambda.zip

      - name: Update Lambda code
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.PROD_LAMBDA_FUNCTION }} \
            --s3-bucket ${{ secrets.DEPLOYMENTS_S3_BUCKET }} \
            --s3-key prod/lambda.zip \
            --region ${{ secrets.AWS_REGION }}
          aws lambda wait function-updated \
            --function-name ${{ secrets.PROD_LAMBDA_FUNCTION }} \
            --region ${{ secrets.AWS_REGION }}

      - name: Update Lambda environment
        # Fusiona con las variables que ya tiene el Lambda en vez de reemplazarlas:
        # un secret vacío o ausente conserva el valor actual. Importante para
        # SECRET_KEY: prod tiene la suya propia; usar la de dev cerraría todas
        # las sesiones. Para cambiarla, crear el secret PROD_SECRET_KEY.
        # Los orígenes van fijos: PROD_AMPLIFY_DOMAIN estaba vacío y dejaba "https://".
        env:
          FN: ${{ secrets.PROD_LAMBDA_FUNCTION }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          NEW_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          NEW_SECRET_KEY: ${{ secrets.PROD_SECRET_KEY }}
          NEW_IMAGES_BUCKET: ${{ secrets.IMAGES_BUCKET }}
          NEW_ALLOWED_ORIGINS: https://app.soylummo.com,https://main.d1999tyl6ud7e5.amplifyapp.com
        run: |
          umask 077
          aws lambda get-function-configuration --function-name "$FN" --region "$AWS_REGION" \
            --query 'Environment' --output json > lambda-env-actual.json
          python3 - <<'PY'
          import json, os
          actual = json.load(open("lambda-env-actual.json")) or {}
          v = actual.get("Variables") or {}
          for k in ("DATABASE_URL", "SECRET_KEY", "IMAGES_BUCKET", "ALLOWED_ORIGINS"):
              nuevo = (os.environ.get("NEW_" + k) or "").strip()
              if nuevo:
                  v[k] = nuevo
          v["ENVIRONMENT"] = "prod"
          faltan = [k for k in ("DATABASE_URL", "SECRET_KEY") if not v.get(k)]
          if faltan:
              raise SystemExit(f"Faltan variables en prod: {faltan}. Abortado para no dejar el Lambda roto.")
          json.dump({"Variables": v}, open("lambda-env.json", "w"))
          PY
          aws lambda update-function-configuration \
            --function-name "$FN" \
            --environment file://lambda-env.json \
            --region "$AWS_REGION"
          rm -f lambda-env.json lambda-env-actual.json
