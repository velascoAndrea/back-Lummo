name: Deploy Prod

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    name: Backend → Lambda (prod)
    runs-on: ubuntu-latest
    environment: production   # requires manual approval in GitHub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build Lambda package
        run: |
          mkdir -p package
          pip install -r requirements.txt -t package/ \
            --platform manylinux2014_x86_64 \
            --implementation cp \
            --python-version 3.11 \
            --only-binary=:all: \
            --upgrade --quiet
          cp -r app/ package/app/
          cd package && zip -r ../lambda.zip . -x "*.pyc" -x "*/__pycache__/*" && cd ..

      - name: Upload package to S3
        run: |
          aws s3 cp lambda.zip s3://${{ secrets.DEPLOYMENTS_S3_BUCKET }}/prod/lambda.zip

      - name: Update Lambda code
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.PROD_LAMBDA_FUNCTION }} \
            --s3-bucket ${{ secrets.DEPLOYMENTS_S3_BUCKET }} \
            --s3-key prod/lambda.zip \
            --region ${{ secrets.AWS_REGION }}
          aws lambda wait function-updated \
            --function-name ${{ secrets.PROD_LAMBDA_FUNCTION }} \
            --region ${{ secrets.AWS_REGION }}

      - name: Update Lambda environment
        # JSON en vez de la sintaxis abreviada "Variables={A=1,B=2}": esa separa por
        # comas y no admite una lista de orígenes. Los dominios van fijos aquí porque
        # el secret PROD_AMPLIFY_DOMAIN estaba vacío y dejaba ALLOWED_ORIGINS="https://".
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ALLOWED_ORIGINS: https://app.soylummo.com,https://main.d1999tyl6ud7e5.amplifyapp.com
          IMAGES_BUCKET: ${{ secrets.IMAGES_BUCKET }}
        run: |
          python3 -c 'import json, os; json.dump({"Variables": {k: os.environ[k] for k in ("DATABASE_URL", "SECRET_KEY", "ALLOWED_ORIGINS", "IMAGES_BUCKET")} | {"ENVIRONMENT": "prod"}}, open("lambda-env.json", "w"))'
          aws lambda update-function-configuration \
            --function-name ${{ secrets.PROD_LAMBDA_FUNCTION }} \
            --environment file://lambda-env.json \
            --region ${{ secrets.AWS_REGION }}
          rm -f lambda-env.json
